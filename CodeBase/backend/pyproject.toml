[project]
name = "ptcl-backend"
version = "0.1.0"
description = "Document-intelligence service: document in, verified fields out."
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "celery>=5.4",
    "redis>=5.2",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "pillow>=11.0",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-openpyxl>=3.1",
    "types-jsonschema>=4.23",
]
ocr = [
    "paddleocr>=3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unreachable = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["paddleocr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast, no I/O",
    "integration: needs Postgres/Redis",
    "contract: asserts API_CONTRACT.md conformance",
]
